name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Validate inventory
        run: bun run inventory:validate
      - name: Validate request contract
        run: bun run request:validate
      - name: Validate SEO contract
        run: bun run seo:validate
      - name: Validate analytics privacy
        run: bun run analytics:validate
      - name: Validate translations
        run: bun run i18n:validate
      - name: Build
        run: bun run build
      - name: Smoke test production routes
        run: bun run test:smoke
